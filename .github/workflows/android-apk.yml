name: 📱 Android APK (self-build)

# Self-contained Android APK builder for forks.
#
# Unlike release.yml / google-play.yml, every credential here is OPTIONAL.
# A fork with no repository secrets still produces an installable APK:
#   - Telegram api_id/api_hash -> falls back to placeholders; the app then
#     offers "Configure custom API" on the login screen so you can type your
#     own credentials from https://my.telegram.org inside the app.
#   - Signing keystore         -> falls back to the debug key (see
#     android/app/build.gradle.kts). Sideloading works; Play upload does not.
#   - Firebase google-services -> Gradle skips Firebase Analytics entirely.
#   - Sentry DSN               -> resolves to an empty string.
#
# The prebuilt TDLib (libtdjson.so) is downloaded checksum-pinned from the
# public iebb/mithka-tdjson release, so TDLib is NOT compiled from source here.

on:
  workflow_dispatch:
    inputs:
      abi:
        description: 'Target ABI to build (all = every supported ABI)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - arm64-v8a
          - armeabi-v7a
          - x86_64
      publish_release:
        description: 'Also publish the APKs to the "self-build-latest" prerelease'
        required: false
        default: true
        type: boolean
  push:
    branches: [master]

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.2'
  JAVA_VERSION: '17'
  NDK_VERSION: '28.2.13676358'

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve build targets
        id: targets
        env:
          REQUESTED_ABI: ${{ github.event.inputs.abi || 'all' }}
        run: |
          case "$REQUESTED_ABI" in
            all)         abis="arm64-v8a armeabi-v7a x86_64"; targets="android-arm64 android-arm android-x64" ;;
            arm64-v8a)   abis="arm64-v8a";   targets="android-arm64" ;;
            armeabi-v7a) abis="armeabi-v7a"; targets="android-arm" ;;
            x86_64)      abis="x86_64";      targets="android-x64" ;;
            *)           echo "::error::unknown ABI: $REQUESTED_ABI"; exit 1 ;;
          esac
          echo "abis=$abis" >> "$GITHUB_OUTPUT"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Building ABIs: $abis"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${{ env.NDK_VERSION }}" >/dev/null 2>&1 || \
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}" >/dev/null 2>&1 || true
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Cache tdjson
        uses: actions/cache@v6
        with:
          path: android/app/src/main/jniLibs
          key: tdjson-android-${{ runner.os }}-${{ hashFiles('scripts/tdjson-manifest.json') }}

      - name: Install pinned tdjson
        run: scripts/build-tdjson-android.sh ${{ steps.targets.outputs.abis }}

      - name: Flutter dependencies
        run: flutter pub get

      - name: Write Firebase Android config
        env:
          FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64:-}" ]; then
            mkdir -p android/app
            printf '%s' "$FIREBASE_ANDROID_GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json
            echo "Firebase config written."
          else
            echo "Firebase secret not set - building without Firebase Analytics."
          fi

      - name: Write lib/config/secrets.dart
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          mkdir -p lib/config
          cat > lib/config/secrets.dart <<EOF
          //
          //  secrets.dart — generated by .github/workflows/android-apk.yml.
          //  Git-ignored; never committed.
          //
          class Secrets {
            static const int apiId = ${TELEGRAM_API_ID:-0};
            static const String apiHash = '${TELEGRAM_API_HASH:-}';
            static bool get isConfigured => apiId != 0 && apiHash.isNotEmpty;
          }
          EOF
          if [ -z "${TELEGRAM_API_HASH:-}" ] || [ "${TELEGRAM_API_ID:-0}" = "0" ]; then
            echo "Telegram credentials not set - the APK will offer a custom-API prompt on the login screen."
          else
            echo "Telegram credentials injected from repository secrets."
          fi

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            : "${STORE_PASSWORD:?set ANDROID_KEYSTORE_PASSWORD alongside ANDROID_KEYSTORE_BASE64}"
            : "${KEY_ALIAS:?set ANDROID_KEY_ALIAS alongside ANDROID_KEYSTORE_BASE64}"
            printf '%s' "$KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=${KEY_PASSWORD:-$STORE_PASSWORD}
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Release keystore decoded."
          else
            echo "No keystore secret configured - release APK will be debug-signed (sideload only)."
          fi

      - name: Build release APKs
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          TARGETS: ${{ steps.targets.outputs.targets }}
        run: |
          for target in $TARGETS; do
            echo "=== building $target ==="
            flutter build apk --release --split-per-abi \
              --dart-define="I_DONT_FUCKING_CARE_ABOUT_TOS=false" \
              --target-platform "$target" \
              --dart-define="GIT_COMMIT=${GITHUB_SHA::7}" \
              --dart-define="CI_BUILD_STAMP=$(date -u +%Y%m%d%H%M%S)" \
              --dart-define="SENTRY_DSN=$SENTRY_DSN"
          done

      - name: Verify APK contents
        run: |
          shopt -s nullglob
          apks=(build/app/outputs/flutter-apk/*.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "::error::no APK produced"
            ls -R build/app/outputs || true
            exit 1
          fi
          for apk in "${apks[@]}"; do
            echo "--- $apk ($(du -h "$apk" | cut -f1)) ---"
            unzip -l "$apk" | grep -E "lib/.*\.so" || echo "WARNING: no .so bundled"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: mithka-android-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

  release:
    name: Publish to self-build-latest prerelease
    needs: build
    if: ${{ github.event.inputs.publish_release != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v7
        with:
          name: mithka-android-apk-${{ github.run_number }}
          path: apks

      - name: Create or refresh prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: self-build-latest
        run: |
          set -euo pipefail
          cd apks
          ls -lh ./*.apk
          # Idempotent: replace the previous self-build prerelease so the
          # download URL stays stable across runs.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create "$TAG" ./*.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Self-build Android APK (${GITHUB_SHA::7})" \
            --prerelease \
            --notes "Automated self-build of \`${{ github.ref_name }}\` @ \`${GITHUB_SHA::7}\` by \`.github/workflows/android-apk.yml\`.

          - Debug-signed unless ANDROID_KEYSTORE_BASE64 is configured, so this is for sideloading / personal testing only.
          - If TELEGRAM_API_ID and TELEGRAM_API_HASH were not configured as repository secrets, open **Configure custom API** on the login screen and enter your own credentials from https://my.telegram.org ."
